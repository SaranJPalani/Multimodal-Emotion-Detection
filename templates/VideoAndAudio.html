<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="icon" href="{{ url_for('static', filename='images/soulmates.png') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        video {
            border: 2px solid black;
            margin: 20px auto;
        }
        #emotion {
            font-size: 24px;
            margin-top: 20px;
        }
        .navbar {
            background-color: #212529;
            color: white;
            display: flex;
            width: 100%;
            justify-content: space-around;
            font-size: 18px;
        }

        a{
            color: inherit;
            text-decoration: none;
            padding-top: 40px;
        }

        a:hover{
            color: #71696d;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2><a href="{{ url_for('home')}}">Cool EndSemProject</a></h2>
        <a href="{{ url_for('Video') }}"><b>Video Emotion Detection</b></a>
        <a href="{{ url_for('Audio') }}"><b>Audio Emotion Detection</b></a>
        <a href="{{ url_for('VideoAndAudio') }}"><b>Multimodal Detection</b></a>
    </div>
    <h1>Multimodal Emotion Detector</h1>
    <img src="/video_feed" alt="Video Feed" style="width: 80%; max-width: 640px;"/>
    <div class="emotion-container">
        <div class="emotion-box">
            <h3>Video</h3>
            <p id="videoEmotion">Neutral</p>
        </div>
        <div class="emotion-box merged">
            <h3>Merged</h3>
            <p id="mergedEmotion">Neutral</p>
        </div>
        <div class="emotion-box">
            <h3>Audio</h3>
            <p id="audioEmotion">Neutral,Confidence: 1</p>
        </div>
    </div>

    <p id="timer">Refreshes in: 5</p>

    <script>
        var time = 5;
        function updateAudioEmotion() {
            fetch('/merged_emotion')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('audioEmotion').innerText = data.audio_emotion;
                    document.getElementById('videoEmotion').innerText = data.video_emotion;
                    document.getElementById('mergedEmotion').innerText = data.merged_emotion;
                });
        }
        function timer(){
                time--;
                if(time == 0){
                    time = 5;
                }
                document.getElementById('timer').innerText = `Audio refreshes in : ${time}`;
        }
        setInterval(updateAudioEmotion, 5000);
        setInterval(timer, 1000); 
    </script>
</body>
</html>
