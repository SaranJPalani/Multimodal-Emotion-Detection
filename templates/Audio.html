<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="icon" href="{{ url_for('static', filename='images/soulmates.png') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        video {
            border: 2px solid black;
            margin: 20px auto;
        }
        #emotion {
            font-size: 24px;
            margin-top: 20px;
        }
        .navbar {
            background-color: #212529;
            color: white;
            display: flex;
            width: 100%;
            justify-content: space-around;
            font-size: 18px;
        }

        a{
            color: inherit;
            text-decoration: none;
            padding-top: 40px;
        }

        a:hover{
            color: #71696d;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2><a href="{{ url_for('home')}}">Cool EndSemProject</a></h2>
        <a href="{{ url_for('Video') }}"><b>Video Emotion Detection</b></a>
        <a href="{{ url_for('Audio') }}"><b>Audio Emotion Detection</b></a>
        <a href="{{ url_for('VideoAndAudio') }}"><b>Multimodal Detection</b></a>
    </div>
    <h1>Audio
         Emotion Detector</h1>
    <p id="emotion">Audio Emotion: neutral,Confidence: 1</p>
    <p id="timer">Refreshes in : 5</p>

    <script>
        var time = 5;
        function updateAudioEmotion() {
            fetch('/audio_emotion')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('emotion').innerText = `Audio Emotion: ${data.audio_emotion}`;
                });
        }
        function timer(){
                time--;
                if(time == 0){
                    time = 5;
                }
                document.getElementById('timer').innerText = `Refreshes in : ${time}`;
        }
        setInterval(updateAudioEmotion, 5000);
        setInterval(timer, 1000);
    </script>
</body>
</html>
